
name: Build PELICAN STRIKE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -q PELICAN_STRIKE_Android.zip

      - name: Build APK
        run: |
          cd PELICAN_STRIKE_Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PELICAN-STRIKE-APK
          path: PELICAN_STRIKE_Android/app/build/outputs/apk/debug/app-debug.apk
          
